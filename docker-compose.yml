services:

  # ============================================================
  # POSTGRESQL
  # ============================================================

  postgres:
    image: postgres:16
    container_name: dollarquotation-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - dollarquotation_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  # ============================================================
  # RABBITMQ
  # ============================================================

  rabbitmq:
    image: rabbitmq:4-management
    container_name: dollarquotation-rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - dollarquotation_rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test:
        [
          "CMD",
          "rabbitmq-diagnostics",
          "-q",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  # ============================================================
  # API
  # ============================================================

  api:
    image: ghcr.io/leohslopes/br-dollarquotation-api:latest
    container_name: dollarquotation-api
    restart: unless-stopped

    environment:

      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

      # ----------------------------------------------------------
      # DATABASE
      # ----------------------------------------------------------

      ConnectionStrings__DefaultConnection: >
        Host=postgres;
        Port=5432;
        Database=${POSTGRES_DB};
        Username=${POSTGRES_USER};
        Password=${POSTGRES_PASSWORD}

      # ----------------------------------------------------------
      # JWT
      # ----------------------------------------------------------

      Jwt__SecretKey: ${JWT_SECRET_KEY}
      Jwt__Issuer: Br.DollarQuotation.API
      Jwt__Audience: Br.DollarQuotation.Web
      Jwt__ExpirationInMinutes: "60"

      # ----------------------------------------------------------
      # RABBITMQ
      # ----------------------------------------------------------

      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__UserName: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      RabbitMq__VirtualHost: /
      RabbitMq__ExchangeName: dollarquotation.exchange
      RabbitMq__QuotationQueueName: dollarquotation.quotation.queue
      RabbitMq__QuotationRoutingKey: quotation.updated

      # ----------------------------------------------------------
      # EMAIL
      # ----------------------------------------------------------

      Email__SmtpHost: smtp.gmail.com
      Email__SmtpPort: "587"
      Email__Username: naorespondercambiopurse@gmail.com
      Email__Password: ${EMAIL_PASSWORD}
      Email__SenderEmail: naorespondercambiopurse@gmail.com
      Email__SenderName: Câmbio Pulse

      # ----------------------------------------------------------
      # PASSWORD RESET
      # ----------------------------------------------------------

      PasswordReset__FrontendResetPasswordUrl: http://localhost:4200/reset-password
      PasswordReset__TokenExpirationInMinutes: "30"

    ports:
      - "8080:8080"

    volumes:
      - dollarquotation_dataprotection_keys:/app/data-protection-keys

    depends_on:

      postgres:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 -O /dev/null http://127.0.0.1:8080/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s


  # ============================================================
  # WORKER
  # ============================================================

  worker:
    image: ghcr.io/leohslopes/br-dollarquotation-worker:latest
    container_name: dollarquotation-worker
    restart: unless-stopped

    environment:

      DOTNET_ENVIRONMENT: Production

      # ----------------------------------------------------------
      # DATABASE
      # ----------------------------------------------------------

      ConnectionStrings__DefaultConnection: >
        Host=postgres;
        Port=5432;
        Database=${POSTGRES_DB};
        Username=${POSTGRES_USER};
        Password=${POSTGRES_PASSWORD}

      # ----------------------------------------------------------
      # RABBITMQ
      # ----------------------------------------------------------

      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__UserName: ${RABBITMQ_USER}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      RabbitMq__VirtualHost: /
      RabbitMq__ExchangeName: dollarquotation.exchange
      RabbitMq__QuotationQueueName: dollarquotation.quotation.queue
      RabbitMq__QuotationRoutingKey: quotation.updated

    depends_on:

      postgres:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy


  # ============================================================
  # FRONTEND
  # ============================================================

  frontend:
    image: ghcr.io/leohslopes/br-dollarquotation-web:latest
    container_name: dollarquotation-web
    restart: unless-stopped

    ports:
      - "4200:80"

    depends_on:

      api:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 -O /dev/null http://127.0.0.1/ || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


# ============================================================
# VOLUMES
# ============================================================

volumes:

  dollarquotation_postgres_data:

  dollarquotation_rabbitmq_data:

  dollarquotation_dataprotection_keys: