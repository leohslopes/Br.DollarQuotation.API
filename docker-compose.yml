services:

  postgres:
    image: postgres:16
    container_name: dollarquotation-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: dollar_quotation_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456

    ports:
      - "5432:5432"

    volumes:
      - dollarquotation_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d dollar_quotation_db
      interval: 10s
      timeout: 5s
      retries: 5


  rabbitmq:
    image: rabbitmq:4-management
    container_name: dollarquotation-rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - dollarquotation_rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 10s
      timeout: 5s
      retries: 5


  api:
    image: br-dollarquotation-api:latest
    container_name: dollarquotation-api
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=dollar_quotation_db;Username=postgres;Password=123456

      Jwt__SecretKey: ${JWT_SECRET_KEY}
      Jwt__Issuer: Br.DollarQuotation.API
      Jwt__Audience: Br.DollarQuotation.Web
      Jwt__ExpirationInMinutes: 60

      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: guest
      RabbitMq__Password: guest
      RabbitMq__VirtualHost: /
      RabbitMq__ExchangeName: dollarquotation.exchange
      RabbitMq__QuotationQueueName: dollarquotation.quotation.queue
      RabbitMq__QuotationRoutingKey: quotation.updated

      PasswordReset__FrontendResetPasswordUrl: http://localhost:4200/reset-password
      PasswordReset__TokenExpirationInMinutes: 30

      Email__SmtpHost: smtp.gmail.com
      Email__SmtpPort: 587
      Email__SenderName: Câmbio Pulse
      Email__SenderEmail: naorespondercambiopurse@gmail.com
      Email__Username: naorespondercambiopurse@gmail.com
      Email__Password: ${EMAIL_PASSWORD}

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy


  worker:
    image: br-dollarquotation-worker:latest
    container_name: dollarquotation-worker
    restart: unless-stopped

    environment:
      DOTNET_ENVIRONMENT: Production

      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=dollar_quotation_db;Username=postgres;Password=123456

      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: guest
      RabbitMq__Password: guest
      RabbitMq__VirtualHost: /
      RabbitMq__ExchangeName: dollarquotation.exchange
      RabbitMq__QuotationQueueName: dollarquotation.quotation.queue
      RabbitMq__QuotationRoutingKey: quotation.updated

    depends_on:
      postgres:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy


  frontend:
    image: br-dollarquotation-web:latest
    container_name: dollarquotation-web
    restart: unless-stopped

    ports:
      - "4200:80"

    depends_on:
      - api


volumes:
  dollarquotation_postgres_data:
  dollarquotation_rabbitmq_data: